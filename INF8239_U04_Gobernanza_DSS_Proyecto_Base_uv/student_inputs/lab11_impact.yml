purpose: "Priorizar casos territoriales sintéticos que requieren revisión humana, exclusivamente con fines educativos y de evaluación de controles."
assisted_decision: "Determinar el orden de revisión humana de casos sintéticos; la salida del modelo es una recomendación y no una decisión definitiva."
users: "Equipo analista y personal revisor autorizado para el ejercicio académico."
affected_population: "Grupos territoriales y categorías sintéticas representadas en el dataset; no representan personas ni poblaciones reales."
owner: "Responsable institucional designado para el ejercicio, con autoridad para suspender el sistema."
non_predictive_alternative: "Priorización mediante reglas transparentes previamente documentadas y revisión humana, sin utilizar predicciones del modelo."
out_of_scope_use: "Uso con datos reales, perfilamiento de personas, intervención automática, decisión de elegibilidad o declaración de emergencia."
withdrawal_condition: "Suspender el uso si se detecta uso fuera del alcance, exposición de datos, resultados no reproducibles, fallos de control o brechas de equidad que superen los límites definidos y no puedan mitigarse."
appeal_mechanism: "Registrar la revisión y permitir solicitar una segunda revisión humana ante el responsable designado; documentar la evidencia, respuesta y resolución."
